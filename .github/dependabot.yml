version: 2

# Aggiornamenti periodici delle dipendenze. Le PR di Dependabot passano dalla
# CI (fmt, clippy, test, audit, build): se rompono qualcosa restano rosse.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/app/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # glib arriva da gtk, che tao/tauri usano solo su Linux: un aggiornamento a
    # 0.20 romperebbe la risoluzione senza toccare i binari Windows.
    ignore:
      - dependency-name: "glib"
      - dependency-name: "glib-macros"
      - dependency-name: "glib-sys"
