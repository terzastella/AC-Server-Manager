name: Bug report
description: Qualcosa non funziona come dovrebbe
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione. Per problemi di **sicurezza** non aprire una issue:
        usa [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Cosa succede
      description: Comportamento osservato e comportamento atteso.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo
      placeholder: |
        1. Apri il manager
        2. Vai su Slot e auto
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione
      description: Dalla release o dal nome del file scaricato.
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: logs
    attributes:
      label: Log / messaggi
      description: Dal pannello Log, o l'errore mostrato dall'app.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Controlli
      options:
        - label: Ho letto il README e la sezione "Cosa non è nel repository"
          required: true
        - label: Non ho incollato dati personali (IP reali, token, password)
          required: true
