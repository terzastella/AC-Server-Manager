name: Release

# Due modi per pubblicare:
#  - push di un tag `v*` (comportamento normale);
#  - avvio manuale da Actions, indicando il tag: serve quando il trigger da tag
#    non parte, e mostra subito il log di eventuali errori.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v1.0.19)"
        required: true
        default: "v1.0.19"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build portable executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Ref in uscita
        shell: pwsh
        run: |
          Write-Host "tag: ${{ inputs.tag || github.ref_name }}"
          Write-Host "commit: $(git rev-parse HEAD)"
          git describe --tags --exact-match
          if ($LASTEXITCODE -ne 0) { Write-Host "nessun tag esatto (normale con checkout del solo tag)" }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Frontend checks
        working-directory: app
        shell: pwsh
        run: |
          node scripts/check-versions.mjs
          node scripts/check-i18n.mjs
          npx tsc --noEmit
          npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit

      - name: Rust checks
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --lib
          cargo audit

      - name: Build both executables
        working-directory: app
        shell: pwsh
        run: ./build.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/ACServerControl.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ACServerControl.exe" } | Set-Content dist/SHA256SUMS.txt
          Get-FileHash dist/ACLauncher.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  ACLauncher.exe" } | Add-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Build release body
        shell: pwsh
        run: |
          $notesPath = "docs/release-notes/${{ inputs.tag || github.ref_name }}.md"
          if (-not (Test-Path $notesPath)) { throw "note della release non trovate: $notesPath" }
          $notes = [System.IO.File]::ReadAllText($notesPath, [System.Text.Encoding]::UTF8)
          $sums = [System.IO.File]::ReadAllText("dist/SHA256SUMS.txt", [System.Text.Encoding]::ASCII).Trim()
          if ($notes -notmatch [regex]::Escape("{{CHECKSUMS}}")) { throw "segnaposto {{CHECKSUMS}} assente nelle note" }
          $body = $notes.Replace("{{CHECKSUMS}}", $sums)
          [System.IO.File]::WriteAllText("dist/release-body.md", $body, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content dist/release-body.md -TotalCount 6

      - name: Upload to the release
        id: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: dist/release-body.md
          files: |
            dist/ACServerControl.exe
            dist/ACLauncher.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') }}

      - name: Release pubblicata
        shell: pwsh
        run: |
          Write-Host "release: ${{ steps.release.outputs.url }}"
          Write-Host "asset: ${{ steps.release.outputs.assets }}"
